name: Link check

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
  push:
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md
